router id 192.0.2.11;

log stderr all;

protocol device {
    scan time 10;
}

protocol static blackhole_dynamic {
    ipv4;
    include "/etc/bird/dynamic/blackhole_dynamic_v4.conf";
}

protocol static blackhole_dynamic_v6 {
    ipv6;
    include "/etc/bird/dynamic/blackhole_dynamic_v6.conf";
}

filter export_blackhole {
    if proto = "blackhole_dynamic" || proto = "blackhole_dynamic_v6" then {
        bgp_community.add((65535,666));
        accept;
    }
    reject;
}

template bgp crowdsec_template {
    local as 65101;
    hold time 240;
    keepalive time 80;

    ipv4 {
        import none;
        export filter export_blackhole;
        next hop self;
    };

    ipv6 {
        import none;
        export filter export_blackhole;
        next hop self;
    };
}

protocol bgp router_peer from crowdsec_template {
    neighbor 192.0.2.1 as 65100;
    disabled;
}

